name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Committed plugin engines match the build
        run: git diff --exit-code plugins
      - name: Tests (built bundle; Node 20 cannot run TypeScript sources)
        if: matrix.node == 20
        run: npm run verify:packages
      - name: Tests
        if: matrix.node == 22
        run: npm test && npm run test:dist && npm run verify:packages
