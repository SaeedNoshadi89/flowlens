  // ---------- map

    });
    var marks = C.replayMarks(G, st.scenario ? IX.scenarios[st.scenario] : null, st.step);
    var eg = s('g', { id: 'edges' });
    view.edges.forEach(function (e) {
      var a = lay.pos[e.from], b = lay.pos[e.to];

      var d = C.edgePath(a, b);
      var cls = 'edge ' + e.provenance;
      var isActive = marks.active && e.members.indexOf(marks.active.edge) >= 0;

      if (isActive) cls += ' active'; else if (isSeen) cls += ' seen';

      var tt = s('title'); tt.textContent = edgeSummary(e); hit.appendChild(tt);
      hit.addEventListener('click', function (ev) { ev.stopPropagation(); selectEdge(e.members[0], e); });
      eg.appendChild(hit);
      if (e.count > 1) {
        var mx = (a.x + a.w + b.x) / 2, my = (a.y + b.y) / 2 + a.h / 2 - 4;

      }
      if (isActive && !reduced) {

    });
    g.appendChild(eg);
    var matches = {};

    var ng = s('g', { id: 'nodes' });

      var p = lay.pos[n.id];

      if (marks.active && (marks.active.to === n.id)) cls += ' active';
      else if (marks.seenNodes[n.id]) cls += ' seen';
      if (st.scenario && st.step >= 0 && !marks.seenNodes[n.id]) cls += ' dim';
      if (st.selected === n.id) cls += ' sel';
      if (st.query && matches[n.id]) cls += ' match';
      else if (st.query) cls += ' dim';
      var grp = s('g', { class: cls, transform: 'translate(' + p.x + ',' + p.y + ')', tabindex: '0', role: 'button', 'data-node': n.id, 'aria-label': n.kind + ' ' + n.label + (n.path ? ' in ' + n.path : ''), style: '--kc:' + C.colorOf(n) });
      grp.appendChild(s('rect', { class: 'box', width: p.w, height: p.h, rx: 9 }));
      grp.appendChild(s('rect', { class: 'bar', width: 4, height: p.h - 12, x: 6, y: 6, rx: 2 }));
      grp.appendChild(s('rect', { class: 'frame', x: -4, y: -4, width: p.w + 8, height: p.h + 8, rx: 12 }));
      var lbl = s('text', { class: 'lbl', x: 18, y: 20 }); lbl.textContent = fit(n.label, 23); grp.appendChild(lbl);
      var sub = s('text', { class: 'sub', x: 18, y: 36 }); sub.textContent = fit(subText(n), 27); grp.appendChild(sub);
      var tt = s('title'); tt.textContent = n.kind + ': ' + n.label + (n.path ? '\n' + n.path + (n.line ? ':' + n.line : '') : ''); grp.appendChild(tt);
      grp.addEventListener('click', function (ev) { ev.stopPropagation(); selectNode(n.id); });
      grp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectNode(n.id); } });
      ng.appendChild(grp);
    });
    g.appendChild(ng);
    svg.appendChild(g);
    var empty = $('empty');
    if (!view.nodes.length) { empty.hidden = false; empty.textContent = 'Nothing matches the current filters. Turn relationships or features back on.'; }
    else empty.hidden = true;
    $('mapnote').textContent = (lay.truncated ? 'Showing ' + lay.shown + ' of ' + lay.total + ' nodes (most connected). Narrow the features filter to see the rest. · ' : '') +
      (st.scenario ? 'Scenario view' : st.level === 'modules' ? 'Overview · modules' : 'Overview · functions') + ' · drag to pan, scroll or +/− to zoom, 0 to fit';
    if (refit || !vb) fitView(); else applyViewBox();

  }
  function fit(t, n) { return t.length > n ? t.slice(0, n - 1) + '…' : t; }
  function subText(n) {
    if (n.kind === 'function' || n.kind === 'request') return (n.sub || '') + (n.line ? ':' + n.line : '');
    if (n.kind === 'module') return n.sub || '(root)';
    return n.sub || n.kind;
  }
  function edgeSummary(e) {
    var a = IX.nodes[e.from], b = IX.nodes[e.to];
    return (a ? a.label : e.from) + ' → ' + (b ? b.label : e.to) + ' · ' + e.relation + ' · ' + e.provenance + (e.count > 1 ? ' · ' + e.count + ' edges' : '');
  }

  // ---------- pan and zoom (viewBox)
  function fitView(whole) {
    if (!lay) return;
    var svg = $('svg');
    var cw = svg.clientWidth || 1000, ch = svg.clientHeight || 600;
    var lw = Math.max(lay.width, 300), lh = Math.max(lay.height, 200);
    var scale = Math.min(cw / lw, ch / lh);
    // Keep labels readable: when the whole map would be tiny, fit the width and let the user pan down.
    if (!whole && scale < 0.75) scale = Math.min(cw / lw, 1);
    scale = Math.max(whole ? 0.2 : 0.62, Math.min(scale, 1.35));
    var w = cw / scale, hgt = ch / scale;
    vb = { x: Math.min(0, (lw - w) / 2), y: 0, w: w, h: hgt };
    if (lh < hgt) vb.y = Math.min(0, (lh - hgt) / 2);
    applyViewBox();
  }
  function applyViewBox() { $('svg').setAttribute('viewBox', [vb.x, vb.y, vb.w, vb.h].join(' ')); }
  function zoom(factor, cx, cy) {
    var nw = Math.min(Math.max(vb.w * factor, 200), 20000), nh = vb.h * (nw / vb.w);
    if (cx == null) { cx = vb.x + vb.w / 2; cy = vb.y + vb.h / 2; }
    vb.x = cx - (cx - vb.x) * (nw / vb.w); vb.y = cy - (cy - vb.y) * (nh / vb.h); vb.w = nw; vb.h = nh;
    applyViewBox();
  }
  /** Camera that keeps the active step readable: both ends in view when they fit, else the target. */
  function followStep(step) {
    var a = lay.pos[step.from], b = lay.pos[step.to];
    if (!b || !vb) return;
    var svg = $('svg');
    var cw = svg.clientWidth || 1000, ch = svg.clientHeight || 600;
    var scale = Math.max(cw / vb.w, 0.9);
    var w = cw / scale, hgt = ch / scale;
    var x0 = a ? Math.min(a.x, b.x) : b.x, x1 = a ? Math.max(a.x + a.w, b.x + b.w) : b.x + b.w;
    var y0 = a ? Math.min(a.y, b.y) : b.y, y1 = a ? Math.max(a.y + a.h, b.y + b.h) : b.y + b.h;
    if (x1 - x0 > w - 60) { x0 = b.x; x1 = b.x + b.w; }
    if (y1 - y0 > hgt - 60) { y0 = b.y; y1 = b.y + b.h; }
    vb = { x: (x0 + x1) / 2 - w / 2, y: Math.max(-20, (y0 + y1) / 2 - hgt / 2), w: w, h: hgt };
    applyViewBox();
  }
  function ensureVisible(id) {
    var p = lay && lay.pos[id];
    if (!p || !vb) return;
    var margin = 40;
    if (p.x >= vb.x + margin && p.x + p.w <= vb.x + vb.w - margin && p.y >= vb.y + margin && p.y + p.h <= vb.y + vb.h - margin) return;
    vb.x = p.x + p.w / 2 - vb.w / 2; vb.y = p.y + p.h / 2 - vb.h / 2;
    applyViewBox();
  }
  function bindPanZoom() {
    var svg = $('svg');
    var drag = null;
    svg.addEventListener('wheel', function (e) {
      e.preventDefault();
      var r = svg.getBoundingClientRect();
      var cx = vb.x + (e.clientX - r.left) / r.width * vb.w, cy = vb.y + (e.clientY - r.top) / r.height * vb.h;
      zoom(e.deltaY > 0 ? 1.12 : 1 / 1.12, cx, cy);
    }, { passive: false });
    svg.addEventListener('pointerdown', function (e) {
      if (e.target.closest && (e.target.closest('.node') || e.target.classList.contains('edge-hit'))) return;
      drag = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y, moved: false };
      svg.setPointerCapture(e.pointerId); svg.classList.add('dragging');
    });
    svg.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var r = svg.getBoundingClientRect();
      var dx = (e.clientX - drag.x) / r.width * vb.w, dy = (e.clientY - drag.y) / r.height * vb.h;
      if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) drag.moved = true;
      vb.x = drag.vx - dx; vb.y = drag.vy - dy; applyViewBox();
    });
    var end = function () { if (drag && !drag.moved) { st.selected = null; st.selectedEdge = null; renderDetails(); renderMap(false); syncHash(); } drag = null; svg.classList.remove('dragging'); };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', function () { drag = null; svg.classList.remove('dragging'); });
  }

  // ---------- replay controls
  function renderControls() {
    var sc = st.scenario ? IX.scenarios[st.scenario] : null;
    var n = sc ? sc.steps.length : 0;
    ['btnRestart', 'btnBack', 'btnPlay', 'btnNext'].forEach(function (id) { $(id).disabled = !sc; });
    $('btnExit').hidden = !sc;
    $('btnFollow').hidden = !sc;
    $('btnFollow').setAttribute('aria-pressed', String(!!st.follow));
    if (sc) { $('btnBack').disabled = st.step < 0; $('btnNext').disabled = st.step >= n - 1; }
    var play = $('btnPlay');
    play.textContent = st.playing ? 'Pause' : (sc && st.step >= n - 1 ? 'Replay' : 'Play');
    play.setAttribute('aria-pressed', String(st.playing));
    $('counter').textContent = sc ? 'step ' + Math.max(0, st.step + 1) + ' / ' + n : 'no scenario';
    $('prog').style.width = sc && n ? ((st.step + 1) / n * 100) + '%' : '0';
    Array.prototype.forEach.call(document.querySelectorAll('[data-speed]'), function (b) { b.setAttribute('aria-pressed', String(parseFloat(b.getAttribute('data-speed')) === st.speed)); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-level]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-level') === st.level)); b.disabled = !!sc; });
    document.body.setAttribute('data-step', String(st.step + 1));
    document.body.setAttribute('data-scenario', st.scenario || '');
    document.body.setAttribute('data-playing', String(st.playing));
  }
  function go(delta) {
    var sc = st.scenario ? IX.scenarios[st.scenario] : null;
    if (!sc) return;
    st.step = C.moveStep(st, sc, delta);
    var a = sc.steps[st.step];
    st.selectedEdge = a ? a.edge : null;
    st.selected = null;
    renderStep();
  }
  function jump(i) { stop(); st.step = i; var sc = IX.scenarios[st.scenario]; st.selectedEdge = sc.steps[i] ? sc.steps[i].edge : null; st.selected = null; renderStep(); }
  function play() {
    var sc = st.scenario ? IX.scenarios[st.scenario] : null;
    if (!sc) return;
    if (st.step >= sc.steps.length - 1) st.step = -1;
    st.playing = true;
    tick();
  }
  function tick() {
    clearTimeout(timer);
    var sc = st.scenario ? IX.scenarios[st.scenario] : null;
    if (!st.playing || !sc) return;
    go(1);
    if (st.step >= sc.steps.length - 1) { st.playing = false; renderControls(); syncHash(); return; }
    timer = setTimeout(tick, C.stepDelay(st.speed));
  }
  function stop() { st.playing = false; clearTimeout(timer); }
  function renderStep() { renderMap(false); renderNow(); renderLog(); renderDetails(); renderControls(); syncHash(); }

  function renderNow() {
    var box = clear($('now'));
    var sc = st.scenario ? IX.scenarios[st.scenario] : null;
    if (!sc) {
      box.appendChild(h('p', { cls: 'muted', text: 'Pick a scenario on the left to replay it step by step. The overview shows every analyzed relationship; filters switch views without re-running analysis.' }));
      $('nowMeta').textContent = '';
      return;
    }
    $('nowMeta').textContent = sc.kind;
    if (st.step < 0) {
      box.appendChild(h('div', { cls: 'ev', text: sc.title }));
      box.appendChild(h('p', { text: sc.summary }));
      box.appendChild(h('p', { cls: 'note', text: 'Simulated replay: the order follows the source code, not a recorded run. Press Play or → to step.' }));

    }
    var step = sc.steps[st.step];
    var e = IX.edges[step.edge];
    box.appendChild(h('div', { cls: 'ev', role: 'status', text: step.title }));
    var meta = h('div', { cls: 'bar', style: 'gap:6px' }, tag(e.provenance), h('span', { cls: 'tag kind', text: e.kind.replace('_', ' ') }), h('span', { cls: 'tag kind', text: e.relation }));
    if (step.branch) meta.appendChild(h('span', { cls: 'tag kind', text: 'alternative ' + step.branch.option + ' of ' + step.branch.of + (step.branch.condition ? ' · ' + step.branch.condition : '') }));

    box.appendChild(provenanceNote(e));

  }
  function provenanceNote(e) {
    var text = e.provenance === 'observed' ? 'Observed: written directly in source at the location below.' :
      e.provenance === 'inferred' ? 'Inferred: ' + (e.reason || 'joined by a rule.') : 'Unresolved: ' + (e.reason || 'the target is decided at runtime.');
    return h('p', { cls: 'why ' + e.provenance, text: text });
  }
  function evidenceList(e) {

    return ul;
  }

  function renderLog() {
    var ol = clear($('log'));
    var sc = st.scenario ? IX.scenarios[st.scenario] : null;
    if (!sc) { ol.appendChild(h('li', { cls: 'sep', text: 'No scenario selected' })); return; }
    ol.appendChild(h('li', { cls: 'sep', text: 'Simulated · ' + sc.title }));
    sc.steps.forEach(function (stp, i) {
      var li = h('li', { cls: i === st.step ? 'cur' : i < st.step ? 'seen' : '', tabindex: '0', 'data-step': String(i + 1), on: {
        click: function () { jump(i); },
        keydown: function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); jump(i); } }
      } });
      li.appendChild(h('span', { cls: 'i', text: '#' + (i + 1 < 10 ? '0' : '') + (i + 1) }));
      li.appendChild(h('span', null, tag(stp.provenance)));

      if (stp.branch) t.appendChild(h('span', { cls: 'alt', text: '↳ alternative ' + stp.branch.option + '/' + stp.branch.of + (stp.branch.condition ? ' · ' + stp.branch.condition : '') }));
      li.appendChild(t);
      ol.appendChild(li);

      if (i === st.step) setTimeout(function () {

        else if (bottom > ol.scrollTop + ol.clientHeight) ol.scrollTop = bottom - ol.clientHeight;
      }, 0);
    });
  }

  // ---------- details
  function selectNode(id) { st.selected = id; st.selectedEdge = null; renderDetails(); renderMap(false); syncHash(); }
  function selectEdge(id, agg) { st.selectedEdge = id; st.selected = null; renderDetails(agg); renderMap(false); syncHash(); }
  function renderDetails(agg) {
    var box = clear($('details'));
    if (st.selectedEdge) {
      var group = agg && agg.members && agg.members.length > 1 ? agg.members : [st.selectedEdge];
      if (group.length > 1) box.appendChild(h('p', { cls: 'note', text: group.length + ' source relationships are combined in this line. Each is listed with its own evidence.' }));
      group.forEach(function (eid) { var e = IX.edges[eid]; if (e) box.appendChild(edgeDetails(e)); });
      return;
    }
    if (!st.selected) { box.appendChild(h('p', { cls: 'muted', text: 'Select a node or an edge (click, or Tab then Enter) to see where it comes from.' })); return; }
    var n = IX.nodes[st.selected];
    if (!n) return;
    box.appendChild(h('div', { cls: 'ev mono', style: 'font-weight:700;overflow-wrap:anywhere', text: n.label }));
    var dl = h('dl', { cls: 'kv' });
    var add = function (k, v) { if (v == null || v === '') return; dl.appendChild(h('dt', { text: k })); dl.appendChild(typeof v === 'string' ? h('dd', { text: v }) : h('dd', null, v)); };
    add('Kind', n.kind); add('Layer', n.layer); add('Feature', n.feature);
    if (n.path) add('Source', srcLink(n.path, n.line));
    if (n.module && IX.nodes[n.module]) add('Module', IX.nodes[n.module].path);
    add('Language', n.language); add('Adapter', n.adapter);
    if (n.attrs) Object.keys(n.attrs).forEach(function (k) { add(k, String(n.attrs[k])); });
    box.appendChild(dl);
    var outs = G.edges.filter(function (e) { return e.from === n.id; }), ins = G.edges.filter(function (e) { return e.to === n.id; });
    if (n.kind === 'module') {
      G.nodes.forEach(function (c) { if (c.module === n.id) { G.edges.forEach(function (e) { if (e.from === c.id) outs.push(e); if (e.to === c.id) ins.push(e); }); } });
    }
    box.appendChild(edgeButtons('Outgoing', outs, 'to'));
    box.appendChild(edgeButtons('Incoming', ins, 'from'));
    var inScn = G.scenarios.filter(function (sc) { return sc.steps.some(function (x) { return x.from === n.id || x.to === n.id; }); });
    if (inScn.length) {
      box.appendChild(h('h3', { cls: 'sub', text: 'In scenarios' }));
      var ul = h('ul', { cls: 'elist' });
      inScn.slice(0, 12).forEach(function (sc) { ul.appendChild(h('li', null, h('button', { type: 'button', on: { click: function () { selectScenario(sc.id); } } }, h('span', { cls: 't', text: sc.title })))); });
      box.appendChild(ul);
    }
  }
  function edgeButtons(title, list, end) {
    var frag = h('div');
    frag.appendChild(h('h3', { cls: 'sub', text: title + ' (' + list.length + ')' }));
    var ul = h('ul', { cls: 'elist' });
    list.slice(0, 40).forEach(function (e) {
      var other = IX.nodes[e[end]];
      ul.appendChild(h('li', null, h('button', { type: 'button', on: { click: function () { selectEdge(e.id); } } }, tag(e.provenance), h('span', { cls: 't', text: e.kind.replace('_', ' ') + ' ' + (other ? other.label : e[end]) }))));
    });
    if (list.length > 40) ul.appendChild(h('li', { cls: 'note', text: '… ' + (list.length - 40) + ' more' }));
    frag.appendChild(ul);
    return frag;
  }
  function edgeDetails(e) {
    var a = IX.nodes[e.from], b = IX.nodes[e.to];
    var wrap = h('div', { style: 'margin-bottom:12px' });
    wrap.appendChild(h('div', { cls: 'ev mono', style: 'font-weight:700;overflow-wrap:anywhere', text: (a ? a.label : e.from) + ' → ' + (b ? b.label : e.to) }));
    wrap.appendChild(h('div', { cls: 'bar', style: 'gap:6px;margin:6px 0' }, tag(e.provenance), h('span', { cls: 'tag kind', text: e.kind.replace('_', ' ') }), h('span', { cls: 'tag kind', text: e.relation }), e.condition ? h('span', { cls: 'tag kind', text: 'if ' + e.condition }) : null));
    wrap.appendChild(provenanceNote(e));
    if (e.data) wrap.appendChild(h('p', null, h('span', { cls: 'muted', text: 'Passes: ' }), h('span', { cls: 'mono', text: e.data })));
    if (e.branchGroup) {
      var alts = G.edges.filter(function (x) { return x.branchGroup === e.branchGroup && x.id !== e.id; });
      if (alts.length) wrap.appendChild(h('p', { cls: 'note', text: 'Alternative branches at this point: ' + alts.map(function (x) { var t = IX.nodes[x.to]; return (t ? t.label : x.to) + (x.condition ? ' (' + x.condition + ')' : ''); }).join(', ') + '. Only one runs at a time.' }));
    }
    wrap.appendChild(h('h3', { cls: 'sub', text: 'Evidence' }));
    wrap.appendChild(evidenceList(e));
    var nav = h('div', { cls: 'bar', style: 'gap:6px;margin-top:6px' });
    if (a) nav.appendChild(h('button', { type: 'button', text: 'Go to source node', on: { click: function () { selectNode(a.id); } } }));
    if (b) nav.appendChild(h('button', { type: 'button', text: 'Go to target node', on: { click: function () { selectNode(b.id); } } }));
    wrap.appendChild(nav);
    return wrap;
  }

  // ---------- search
  function bindSearch() {
    var q = $('q'), res = $('results');
    q.addEventListener('input', function () {
      st.query = q.value;
      var found = C.search(G, q.value, 20);
      clear(res);
      res.hidden = !q.value;
      if (q.value && !found.length) res.appendChild(h('li', { cls: 'note', style: 'padding:6px 8px', text: 'No matches in the analyzed graph.' }));
      found.forEach(function (n) {
        res.appendChild(h('li', null, h('button', { type: 'button', on: { click: function () { pick(n); } } }, n.label, h('small', { text: n.kind + (n.path ? ' · ' + n.path + (n.line ? ':' + n.line : '') : '') }))));
      });
      renderMap(false);
    });
    q.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { var f = C.search(G, q.value, 1)[0]; if (f) pick(f); }
      if (e.key === 'Escape') { q.value = ''; st.query = ''; res.hidden = true; renderMap(false); }
      if (e.key === 'ArrowDown') { var b = res.querySelector('button'); if (b) { e.preventDefault(); b.focus(); } }
    });
    function pick(n) {
      res.hidden = true;
      if (st.scenario) { var sc = IX.scenarios[st.scenario]; if (!sc.steps.some(function (x) { return x.from === n.id || x.to === n.id; })) { stop(); st.scenario = null; st.step = -1; renderScenarios(); renderNow(); renderLog(); } }
      if (st.level === 'modules' && (n.kind === 'function' || n.kind === 'request')) st.level = 'functions';
      if (st.features && n.feature && st.features.indexOf(n.feature) < 0) st.features.push(n.feature);
      st.selected = n.id; st.selectedEdge = null;
      renderMap(false); renderFilters(); renderDetails(); renderControls(); ensureVisible(n.id); syncHash();
      var el = document.querySelector('[data-node="' + cssEscape(n.id) + '"]');
      if (el) el.focus();
    }
  }
  function cssEscape(v) { return window.CSS && CSS.escape ? CSS.escape(v) : v.replace(/["\\]/g, '\\$&'); }

  // ---------- keyboard and wiring
  function bindKeys() {
    document.addEventListener('keydown', function (e) {
      var tagName = (e.target && e.target.tagName) || '';
      if (/INPUT|TEXTAREA|SELECT/.test(tagName)) return;
      if (e.key === '/') { e.preventDefault(); $('q').focus(); return; }
      if (e.key === 'ArrowRight') { e.preventDefault(); stop(); go(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); go(-1); }
      else if (e.key === ' ' && !/BUTTON|A/.test(tagName) && !(e.target.getAttribute && e.target.getAttribute('role') === 'button')) { e.preventDefault(); toggleplay(); }
      else if (e.key === 'Home') { e.preventDefault(); stop(); st.step = -1; renderStep(); }
      else if (e.key === '+' || e.key === '=') zoom(1 / 1.2);
      else if (e.key === '-') zoom(1.2);
      else if (e.key === '0') fitView(true);
      else if (e.key === 'Escape') { st.selected = null; st.selectedEdge = null; renderDetails(); renderMap(false); syncHash(); }
    });
  }
  function toggleplay() { if (st.playing) { stop(); renderControls(); syncHash(); } else { play(); renderControls(); } }
  function bindControls() {
    $('btnPlay').addEventListener('click', toggleplay);
    $('btnNext').addEventListener('click', function () { stop(); go(1); });
    $('btnBack').addEventListener('click', function () { stop(); go(-1); });
    $('btnRestart').addEventListener('click', function () { stop(); st.step = -1; st.selectedEdge = null; renderStep(); });
    $('btnExit').addEventListener('click', function () { selectScenario(null); });
    $('btnZoomIn').addEventListener('click', function () { zoom(1 / 1.2); });
    $('btnZoomOut').addEventListener('click', function () { zoom(1.2); });
    $('btnFit').addEventListener('click', function () { st.follow = false; renderControls(); fitView(true); });
    $('btnFollow').addEventListener('click', function () { st.follow = !st.follow; renderControls(); if (st.follow) renderMap(false); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-speed]'), function (b) {
      b.addEventListener('click', function () { st.speed = parseFloat(b.getAttribute('data-speed')); renderControls(); syncHash(); if (st.playing) { clearTimeout(timer); timer = setTimeout(tick, C.stepDelay(st.speed)); } renderMap(false); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-level]'), function (b) {
      b.addEventListener('click', function () { st.level = b.getAttribute('data-level'); renderAll(true); });
    });
    $('scnq').addEventListener('input', renderScenarios);
    window.addEventListener('hashchange', function () {
      var cur = C.toHash(G, st);
      if (location.hash === cur) return;
      stop();
      st = C.applyHash(G, C.defaultState(G), C.parseHash(location.hash));
      st.follow = true;
      renderAll(true);
    });
  }
  var hashTimer = null;
  function syncHash() {
    clearTimeout(hashTimer);
    hashTimer = setTimeout(function () {
      var hsh = C.toHash(G, st);
      if (location.hash !== hsh) { try { history.replaceState(null, '', hsh || location.pathname + location.search); } catch (e) { /* file:// may refuse */ } }
    }, 120);
  }
  function renderAll(refit) {
    renderScenarios(); renderFilters(); renderMap(refit); renderNow(); renderLog(); renderDetails(); renderControls(); syncHash();
  }

  renderHeader(); renderScope(); renderCoverage(); renderRescan();
  bindControls(); bindPanZoom(); bindSearch(); bindKeys();
  renderAll(true);
  if (st.playing) { st.playing = false; play(); renderControls(); }
  window.__flowlens = { state: function () { return JSON.parse(JSON.stringify(st)); }, view: function () { return { nodes: view.nodes.length, edges: view.edges.length }; } };
  document.body.setAttribute('data-ready', 'true');
})();
</script>
</body>
